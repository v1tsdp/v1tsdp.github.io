<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#6d90b2">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>v1tsdp</title>

  <meta name="description" content="v1tsdp — personal links and contacts">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' ry='20' fill='%232f3237'/><text y='70' x='50' text-anchor='middle' font-family='Times New Roman, serif' font-size='75' font-weight='bold' fill='%23ffffff'>v</text></svg>">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    ::selection {
      background: transparent;
    }

    ::-moz-selection {
      background: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: #6d90b2;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #6d90b2;
      background-image: url("https://github.com/v1tsdp/v1tsdp.github.io/blob/main/background.webp?raw=true");
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100dvh;
    }

    .card {
      width: min(90vw, 430px);
      background: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 50px;
      border-radius: 20px;
      text-align: center;
      animation: fadeIn 0.6s ease;
    }

    .username {
      position: relative;
      display: inline-block;
      font-family: "Times New Roman", Times, serif;
      font-size: 3em;
      font-weight: bold;
      margin-bottom: 30px;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.6);
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .username:active {
      transform: scale(0.97);
      filter: brightness(0.9);
    }

    .copy-toast {
      position: absolute;
      bottom: calc(100% + 2px);
      left: 50%;
      transform: translateX(-50%) translateY(4px);
      font-family: Arial, sans-serif;
      font-size: 13px;
      font-weight: normal;
      color: #ffffff;
      background: rgba(18, 22, 30, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 3px 8px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      text-shadow: none;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .copy-toast.show {
      opacity: 0.85;
      transform: translateX(-50%) translateY(0);
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .social-links > a,
    .dropdown-trigger {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 50px;
      height: 50px;
      color: #ffffff;
      text-decoration: none;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      transition:
        transform 0.2s ease,
        color 0.2s ease,
        filter 0.2s ease;
    }

    .social-links > a:hover,
    .dropdown-trigger:hover,
    .dropdown.active .dropdown-trigger {
      transform: scale(1.15);
      color: #dddddd;
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.35));
    }

    .social-links svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    .dropdown {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .dropdown-menu {
      position: absolute;
      top: calc(100% + 12px);
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: max-content;
      min-width: 180px;
      padding: 8px;
      background: rgba(18, 22, 30, 0.7);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 100;
    }

    .dropdown.active .dropdown-menu {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      height: auto;
      min-height: auto;
      padding: 10px 14px;
      color: #ffffff;
      font-size: 0.9em;
      text-decoration: none;
      white-space: nowrap;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.18s ease, transform 0.15s ease;
    }

    .dropdown-item:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: translateY(-1px);
      filter: none;
    }

    .dropdown-item:active {
      transform: translateY(0);
    }

    .dropdown-link {
      text-decoration: none;
    }

    .dropdown-link::before {
      content: "";
      width: 5px;
      height: 13px;
      display: block;
    }

    .dropdown-link span {
      text-decoration: none;
    }

    .dropdown-link svg {
      width: 13px;
      height: 13px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: block;
    }

    .mono-nick {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      background: rgba(255, 255, 255, 0.12);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.95em;
      letter-spacing: 0.5px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      .card {
        padding: 30px;
      }

      .username {
        font-size: 2em;
      }

      .social-links > a,
      .dropdown-trigger {
        width: 40px;
        height: 40px;
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="username" id="mainUsername">
      v1tsdp
      <span class="copy-toast" id="usernameToast">copied</span>
    </div>

    <div class="social-links">

      <a
        href="https://t.me/v1tsdp?direct"
        title="Telegram"
        aria-label="Telegram Profile"
        rel="me"
      >
        <svg viewBox="0 0 24 24">
          <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
        </svg>
      </a>

      <div class="dropdown" id="discordDropdown">
        <button type="button" class="dropdown-trigger" title="Discord" aria-label="Discord menu">
          <svg role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <title>Discord</title>
            <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.094 13.094 0 0 1-1.873-.894.077.077 0 0 1-.008-.128c.126-.093.252-.19.372-.287a.075.075 0 0 1 .077-.011c3.92 1.793 8.18 1.793 12.061 0a.073.075 0 0 1 .078.009c.12.099.246.195.373.289a.077.077 0 0 1-.006.127 12.298 12.298 0 0 1-1.873.894.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03a.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.156-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.156 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.156-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.156 2.418z"/>
          </svg>
        </button>

        <div class="dropdown-menu">
          <button type="button" class="dropdown-item" id="copyDiscordBtn">
            <span class="btn-text"><span class="mono-nick">vitsdp</span></span>
          </button>
          <a
            href="https://discord.com/users/1064531567537565776"
            target="_blank"
            rel="noopener noreferrer"
            class="dropdown-item dropdown-link"
          >
            <span>link</span>
            <svg viewBox="0 0 24 24">
              <line x1="7" y1="17" x2="17" y2="7"></line>
              <polyline points="7 7 17 7 17 17"></polyline>

      <a
        href="mailto:v1tsdp@duck.com"
        title="Email"
        aria-label="Email"

      <a href="/cat" title="Cat">
        <svg role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><title>Random Cat</title><path d="M3.309 5.116a.87.87 0 0 1 .958.24L7.369 8.89h9.262l3.102-3.536a.867.867 0 0 1 1.52.573v7.807H24v1.735h-4.482V8.232l-1.842 2.099a.87.87 0 0 1-.652.295H6.976a.87.87 0 0 1-.652-.295l-1.842-2.1v7.239H0v-1.735h2.747V5.928c0-.362.224-.685.562-.812m16.209 12.089H24v1.735h-4.482zM0 17.205h4.482v1.735H0zm9.253-2.892a1.157 1.157 0 1 1-2.314 0 1.157 1.157 0 0 1 2.314 0m7.807 0a1.157 1.157 0 1 1-2.313 0 1.157 1.157 0 0 1 2.313 0"/></svg>
      </a>
    </div>
  </div>

  <script>
    const dropdown = document.getElementById('discordDropdown');
    const trigger = dropdown.querySelector('.dropdown-trigger');
    const copyBtn = document.getElementById('copyDiscordBtn');
    const discordUsername = 'vitsdp';
    const mainUsername = document.getElementById('mainUsername');
    const usernameToast = document.getElementById('usernameToast');
    const mainNick = 'v1tsdp';

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
      } else {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
      }
    }

    trigger.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdown.classList.toggle('active');
    });

    copyBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      try {
        await copyText(discordUsername);
        const span = copyBtn.querySelector('.btn-text');
        const originalHtml = span.innerHTML;

        span.textContent = 'copied';
        setTimeout(() => {
          span.innerHTML = originalHtml;
        }, 1200);
      } catch (err) {
        console.error(err);
      }
    });

    mainUsername.addEventListener('click', async () => {
      try {
        await copyText(mainNick);
        usernameToast.classList.add('show');
        setTimeout(() => {
          usernameToast.classList.remove('show');
        }, 1200);
      } catch (err) {
        console.error(err);
      }
    });

    document.addEventListener('click', (e) => {
      if (!dropdown.contains(e.target)) {
        dropdown.classList.remove('active');
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        dropdown.classList.remove('active');
      }
    });

    document.addEventListener('contextmenu', (e) => {
      e.preventDefault();
    });
  </script>
</body>
</html>
