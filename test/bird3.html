<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>bird</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg role='img' viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'><path d='M3.309 5.116a.87.87 0 0 1 .958.24L7.369 8.89h9.262l3.102-3.536a.867.867 0 0 1 1.52.573v7.807H24v1.735h-4.482V8.232l-1.842 2.099a.87.87 0 0 1-.652.295H6.976a.87.87 0 0 1-.652-.295l-1.842-2.1v7.239H0v-1.735h2.747V5.928c0-.362.224-.685.562-.812m16.209 12.089H24v1.735h-4.482zM0 17.205h4.482v1.735H0zm9.253-2.892a1.157 1.157 0 1 1-2.314 0 1.157 1.157 0 0 1 2.314 0m7.807 0a1.157 1.157 0 1 1-2.313 0 1.157 1.157 0 0 1 2.313 0' fill='%23ffffff'/></svg>">
    <style>
        html, body {
            background-color: #6d90b2;
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
        }
        img {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 12px;
            color: #6d90b2;
        }
    </style>
</head>
<body>

    <img id="cat" src="" alt="Loading..." referrerpolicy="no-referrer">

    <script>
        const img = document.getElementById('cat');

        async function loadBird(retries = 3) {
            try {
                // Запрос через CORS-прокси с добавлением timestamp против кэширования
                const targetUrl = 'https://some-random-api.com/animal/bird?t=' + Date.now();
                const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(targetUrl);

                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error('API proxy error');

                const data = await response.json();
                let url = data.image;

                if (!url) throw new Error('Empty image URL');

                // Нормализация ссылок Imgur
                if (url.includes('imgur.com')) {
                    url = url.replace(/https?:\/\/(?:i\.)?imgur\.com\//, 'https://i.imgur.com/');
                    url = url.replace(/\.jpeg$/i, '.jpg');
                }

                img.onerror = () => {
                    img.onerror = null;
                    if (retries > 0) {
                        loadBird(retries - 1);
                    } else {
                        img.alt = 'Error';
                    }
                };

                img.src = url;
            } catch (error) {
                console.error(error);
                if (retries > 0) {
                    loadBird(retries - 1);
                } else {
                    img.alt = 'Error';
                }
            }
        }

        loadBird();
    </script>
</body>
</html>
